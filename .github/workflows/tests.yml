# Тесты ядра и интерфейса оператора (веб-интерфейс: FastAPI + страница).
#
# REQUIRE_UI_TESTS=1 превращает любой пропуск теста интерфейса (test_ui_*,
# test_web_*) в падение (tests/ui_guard.py): иначе «зелёный» прогон мог бы
# означать ноль прогнанных тестов интерфейса. Node.js нужен тесту geom.js
# (tests/test_web_geom.py) — на раннерах GitHub он есть.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUIRE_UI_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка пакета
        run: python -m pip install -e ".[dev,ui]"
      - name: ruff
        run: python -m ruff check facade_digitizer tests scripts
      - name: pytest
        run: python -m pytest -q

  docker:
    # Образ интерфейса (docs/docker.md) собирается и запускается: сервер отвечает.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа
        run: docker build -t facade-digitizer-ui .
      - name: Запуск и проверка
        run: |
          mkdir data && sudo chown 1000:1000 data
          docker run -d --name ui -p 127.0.0.1:8765:8765 -v "$PWD/data:/data" facade-digitizer-ui
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8765/api/ping >/dev/null && break
            sleep 2
          done
          docker logs ui
          curl -sf http://127.0.0.1:8765/api/ping
          curl -sf http://127.0.0.1:8765/ | grep -q facade-token
          test -f data/примеры/01_фасад.jpg
