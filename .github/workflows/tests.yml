# Тесты ядра и интерфейса оператора. План 3, задача 1.
#
# Системные библиотеки Qt ставятся отдельным шагом: без них `pip install PySide6`
# даёт пакет, у которого `PySide6.QtWidgets` не импортируется (libEGL.so.1).
# REQUIRE_UI_TESTS=1 превращает любой пропуск теста интерфейса в падение
# (tests/ui_guard.py): иначе «зелёный» прогон мог бы означать ноль прогнанных
# тестов интерфейса.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      REQUIRE_UI_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Системные библиотеки Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Установка пакета
        run: python -m pip install -e ".[dev,ui]"
      - name: ruff
        run: python -m ruff check facade_digitizer tests scripts
      - name: pytest
        run: python -m pytest -q
