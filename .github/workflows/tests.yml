# Тесты ядра и интерфейса оператора. План 3, задача 1.
#
# Системные библиотеки Qt ставятся отдельным шагом: без них `pip install PySide6`
# даёт пакет, у которого `PySide6.QtWidgets` не импортируется (libEGL.so.1).
# REQUIRE_UI_TESTS=1 превращает любой пропуск теста интерфейса в падение
# (tests/ui_guard.py): иначе «зелёный» прогон мог бы означать ноль прогнанных
# тестов интерфейса.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      REQUIRE_UI_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Системные библиотеки Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Установка пакета
        run: python -m pip install -e ".[dev,ui]"
      - name: ruff
        run: python -m ruff check facade_digitizer tests scripts
      - name: pytest
        run: python -m pytest -q

  docker:
    # Образ интерфейса в браузере (docs/docker.md) собирается и запускается:
    # noVNC отвечает, окно программы поднялось.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа
        run: docker build -t facade-digitizer-ui .
      - name: Запуск и проверка
        run: |
          mkdir data && sudo chown 1000:1000 data
          docker run -d --name ui -p 127.0.0.1:6080:6080 -v "$PWD/data:/data" facade-digitizer-ui
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:6080/vnc.html >/dev/null && docker logs ui 2>&1 | grep -q "откройте" && break
            sleep 2
          done
          docker logs ui
          curl -sf http://127.0.0.1:6080/vnc.html >/dev/null
          sleep 5
          docker exec ui pgrep -f facade-digitize-ui
          test -f data/примеры/01_фасад.jpg
