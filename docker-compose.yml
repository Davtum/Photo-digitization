# Интерфейс оператора в браузере: docker compose up --build → http://localhost:8765
services:
  facade-ui:
    build: .
    image: facade-digitizer-ui
    ports:
      # Только с этого компьютера: входа по паролю нет.
      - "127.0.0.1:8765:8765"
    volumes:
      # Рабочая папка: снимки кладутся сюда (или перетаскиваются в браузер),
      # сессии и выгрузка JSON/DXF появляются здесь же.
      - ./data:/data
    environment:
      DEMO: "0"                      # 1 — при запуске открыть готовую демонстрацию
      OPERATOR: ""                   # метка оператора op-xxxxxxxx (необязательно)
